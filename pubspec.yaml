name: userorient_flutter
description: "Feature Voting Board for Flutter. Collect feedback from your users and prioritize your development roadmap."
version: 3.0.0
homepage: https://userorient.com
repository: https://github.com/userorient/userorient-flutter
issue_tracker: https://github.com/userorient/userorient-flutter/issues
topics:
  - feature-request
  - feedback
  - user-experience
  - board
  - upvote

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.2
  flutter_svg_provider: ^1.0.7
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  stupid_simple_sheet: ^0.9.1+1
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/