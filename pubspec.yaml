name: userorient_flutter
description: "Feature Voting Board for Flutter. Collect feedback from your users and prioritize your development roadmap."
version: 3.0.0
homepage: https://userorient.com
repository: https://github.com/userorient/userorient-flutter
issue_tracker: https://github.com/userorient/userorient-flutter/issues
topics:
  - feature-request
  - feedback
  - user-experience
  - board
  - upvote

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.4
  flutter_svg_provider: ^1.0.7
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  package_info_plus: ^10.0.0
  device_info_plus: ^13.0.0
  stupid_simple_sheet: ^0.9.1
  # Already pulled in by stupid_simple_sheet, but only its motion tokens are
  # re-exported — we need MotionCurve to run a spring inside a route.
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/